        <button type="button" data-lang="zh">中文</button>

            <div class="stat"><span class="stat-num" id="stat-english"></span><span class="stat-label" data-i18n="statUndergradEn"></span></div>
            <div class="stat"><span class="stat-num">3</span><span class="stat-label" data-i18n="statTypes"></span></div>
          </div>
        </div>
        <div class="hero-visual" aria-hidden="true">

          <svg viewBox="0 0 420 380" fill="none">
            <defs>
              <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">

            <text x="210" y="222" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="9" letter-spacing="3" fill="#5b6b84">JAPAN</text>

              <circle class="node" cx="210" cy="40" r="4" fill="#7dd3fc"/>

      <p class="section-kicker">Schools</p>
      <h2 data-i18n="navSchools" style="margin-bottom:16px"></h2>
      <div class="filters" id="filters">
        <input type="search" id="q" class="search" data-i18n-ph="searchPlaceholder" autocomplete="off">
        <div class="filter-row">
          <span class="filter-label" data-i18n="filterType"></span>
          <div class="chips" id="f-group"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label" data-i18n="filterField"></span>
          <div class="chips" id="f-field"></div>
        </div>
        <div class="filter-row filter-row-inline">
          <label class="filter-label" for="f-region" data-i18n="filterRegion"></label>

        <div class="cta-actions">
