<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tech Campus Japan</title>
  <meta name="description" content="プログラミング・AI・ロボットを学べる日本の大学・高専・高校ガイド（日本語 / English / 中文） — Japanese universities, KOSEN and high schools for programming, AI and robotics.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 11h14M16 11v12' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="index">
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" data-home href="index.html">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span><span class="brand-name" data-i18n="siteName"></span><span class="brand-sub" data-i18n="siteSub"></span></span>
      </a>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1 data-i18n="heroTitle"></h1>
        <p class="hero-lead" data-i18n="heroLead"></p>
        <div class="stats">
          <div class="stat"><span class="stat-num" id="stat-schools"></span><span class="stat-label" data-i18n="statSchools"></span></div>
          <div class="stat"><span class="stat-num" id="stat-english"></span><span class="stat-label" data-i18n="statEnglish"></span></div>
          <div class="stat"><span class="stat-num">3</span><span class="stat-label" data-i18n="statTypes"></span></div>
        </div>
      </div>
    </section>

    <section class="wrap section">
      <h2 data-i18n="fieldsTitle"></h2>
      <p class="section-lead" data-i18n="fieldsLead"></p>
      <div class="fields-grid" id="fields-grid"></div>
    </section>

    <section class="wrap section" id="schools">
      <div class="filters" id="filters">
        <input type="search" id="q" class="search" data-i18n-ph="searchPlaceholder" autocomplete="off">
        <div class="filter-row">
          <span class="filter-label" data-i18n="filterType"></span>
          <div class="chips" id="f-group"></div>
        </div>
        <div class="filter-row">
          <span class="filter-label" data-i18n="filterField"></span>
          <div class="chips" id="f-field"></div>
        </div>
        <div class="filter-row filter-row-inline">
          <label class="filter-label" for="f-region" data-i18n="filterRegion"></label>
          <select id="f-region" class="select"></select>
          <label class="check"><input type="checkbox" id="f-english"> <span data-i18n="englishOnly"></span></label>
          <button type="button" class="link-btn" id="reset" data-i18n="reset"></button>
        </div>
      </div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="cards" id="cards"></div>
    </section>

    <section class="wrap section">
      <h2 data-i18n="guideTitle"></h2>
      <div class="guide-grid" id="guide-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p id="disclaimer"></p>
      <p class="muted" data-i18n="footerNote"></p>
    </div>
  </footer>

  <script src="data/i18n.js"></script>
  <script src="data/schools.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
